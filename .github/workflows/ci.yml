name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build (${{ matrix.template }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        template: [basic, token, escrow, nft]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Rendered via the same script contributors run locally, so CI cannot
      # diverge from what `scripts/validate-template.sh` checks.
      - name: Render template with dummy values
        run: |
          set -euo pipefail
          OUT_DIR="${{ runner.temp }}/rendered"
          ./scripts/render-template.sh "${{ matrix.template }}" "$OUT_DIR" test-project "Test Author"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"

      # Validates the exact tree about to be compiled: no placeholder survived
      # rendering, the project name and author landed in the right files, and
      # nothing kept its .template suffix.
      - name: Validate rendered output
        run: ./scripts/validate-template.sh "${{ matrix.template }}" "$OUT_DIR"

      # Each template ships a pre-generated, verified Cargo.lock.template that
      # pins ed25519-dalek to 2.2.0 — soroban-env-host's testutils feature
      # otherwise pulls in ed25519-dalek 3.0.0 alongside the older
      # ed25519-dalek used elsewhere in the graph, and the two disagree on
      # which rand_core CryptoRng impl ChaCha20Rng satisfies. --locked makes
      # cargo fail loudly instead of silently re-resolving (and losing the
      # pin) if Cargo.toml and Cargo.lock ever drift out of sync.
      - name: cargo build
        working-directory: ${{ env.OUT_DIR }}
        run: cargo build --locked

      - name: cargo build (wasm32-unknown-unknown)
        working-directory: ${{ env.OUT_DIR }}
        run: cargo build --locked --target wasm32-unknown-unknown

      - name: cargo test
        working-directory: ${{ env.OUT_DIR }}
        run: cargo test --locked
